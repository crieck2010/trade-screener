[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-screener"
version = "0.1.0"
description = "Multi-symbol equity screener: technical/liquidity/fundamental filters, composite z-score ranking, presets, CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["trading", "screener", "screening", "equities", "factors", "quantitative-finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
trade-screener = "trade_screener.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/trade-screener"
Repository = "https://github.com/crieck2010/trade-screener"

[tool.setuptools.packages.find]
where = ["src"]
